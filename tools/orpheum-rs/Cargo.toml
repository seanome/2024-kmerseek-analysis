[package]
name = "orpheum-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Streaming six-frame peptide-reference screening with explicit stop policies"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
