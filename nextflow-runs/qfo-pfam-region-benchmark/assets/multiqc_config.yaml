# MultiQC settings for the QfO Pfam region benchmark report.
#
# The sections themselves are written by bin/build_multiqc_inputs.py as *_mqc.json --
# machine-generated, one file per plot. This file holds only what a person edits: the
# title, the order sections appear in, and the report-wide plot settings.
#
# Section ids here must match the ids that script writes. See the note above
# report_section_order for why every id has to be listed rather than only the ones being
# moved.

title: "QfO Pfam region benchmark"
subtitle: "Domain finding across nine target proteomes: which stretch of a human protein is a PF00001, and did the tool find it"
intro_text: >
  Every tool here searches human query proteins against a Quest-for-Orthologs target
  proteome and reports aligned regions. Each region becomes a domain call by transferring
  the Pfam families annotated on the overlapped target interval onto the query interval,
  then scoring that call against the human protein's own domain instances. Right family in
  the wrong place counts as a false positive. This is not pair-level orthology: a tool
  that finds the correct protein but misplaces the region scores no better than a miss.
  <br><br>
  "Dark" means two different things in this benchmark and they have to be stated
  separately, because the data answers them in opposite directions.
  <b>Dark by divergence</b> is a domain whose closest same-family relative is far away in
  evolutionary time or in percent identity. That is where a coarse alphabet earns its
  keep: read the Divergence and Divergence-retention sections, where the fraction of Fmax
  an arm keeps out to the most distant proteome is a function of how many amino-acid
  classes its alphabet collapses to, on one engine with nothing else varying.
  <b>Dark by disorder</b> is a domain with no confident structure behind it. There, this
  method does not win. On both disorder axes the coarse-alphabet arms fall off faster than
  hhblits, phmmer and foldseek do, and the sequence-only axis, which shares neither the
  AlphaFold-modelling confound nor the shallow-MSA confound, says the same thing as the
  pLDDT one. That half of the claim does not survive its own measurement and is not made
  here.
  <br><br>
  What the model-confidence bands show instead is a regime. Read across every band rather
  than only at the disordered end, the coarse-alphabet arms are non-monotone: weakest where
  the structure is most confident, strongest in the middle. The Model-confidence regime
  section is that shape, and it is a claim about complementarity with the structure
  methods rather than about replacing them.

report_comment: >
  Numbers are read off <code>all_domain_metrics.parquet</code> and the Nextflow trace from
  the same run. Accuracy sections use the held-out half of the Pfam families, because the
  sweep picks its best alphabet and k-mer size on the other half and reporting the winner
  on the data that chose it is optimistically biased.
  <br><br>
  No number in this report carries a sampling error. Every value is a mean over target
  proteomes with no resampling behind it, so a gap narrower than the species-to-species
  spread the leaderboards report as an SD is not a result. Which kmerseek arm a figure
  draws also depends on that figure's own ranking metric and truth set, so an arm followed
  from one section to the next is not necessarily the same arm; pass
  <code>--canonical-variant</code> to pin one and mark it everywhere.

# Not a sequencing run: nothing here is a FASTQ and the sections are plots, not per-sample
# QC. Turning these off removes UI that would only mislead.
show_analysis_paths: false
show_analysis_time: true
skip_generalstats: false

# Written to multiqc_plots/ as png, svg and pdf. The svg is the one that goes in a figure.
export_plots: true

# The sweep is 113 alphabet x ksize combos x 2 low-complexity arms; a leaderboard is
# already reduced to one row per tool, but leave headroom for a run that widens.
max_table_rows: 2000

# Plotly rather than a flat image, however many series a plot ends up with. These are
# meant to be explored -- hovering a point to find which alphabet and k it is, is the
# entire reason the sweep is plotted rather than tabulated.
plots_force_interactive: true
plots_flat_numseries: 100000

# Render every plot on load instead of leaving a "Show plot" button behind the resource
# scatters, which carry one point per task and trip the default limit of 100 immediately.
plots_defer_loading_numseries: 100000
# The deprecated spelling of the same limit. The banner warning readers they may need to
# press "Show plot" is still driven by this one, so both have to be raised.
num_datasets_plot_limit: 100000

table_columns_visible:
  qfo_general_stats: true

# Sections inside a module are sorted by ascending order value. EVERY section this report
# can write is listed below, with no gaps in what is covered, and that completeness is the
# point rather than tidiness.
#
# MultiQC gives an UNLISTED section a default position of 10, 20, 30 ... in discovery
# order, and then sorts the listed and unlisted together on one scale. So a partial list
# does not layer over the defaults, it competes with them: with ~90 sections the unlisted
# ones run out past 900, and in the midi-plus report that put the whole ceiling block and
# every MHC panel AFTER the citations, which were sitting at 310 and were supposed to be
# last. Nothing was misnumbered -- the numbers were being compared against a scale that
# had grown underneath them. Listing everything removes the second scale.
#
# Consequences of that, worth keeping in mind when editing:
#   - A new section MUST be added here, or it lands somewhere arbitrary in the middle.
#   - Order values must be ints; order_modules_and_sections asserts it. There is no
#     fraction to slot between two neighbours, which is why these are spaced by 10.
#   - A plot and its table must not share a number: sharing one renders the TABLE first.
#   - An id listed but not produced is skipped with a debug message, so listing every
#     truth set (pfam, pfamn, swissprot, mcsa) is safe when a run builds only some.
#
# qfo_conclusions is first, immediately after the General Statistics table, because it is
# the reading order for everything below it.
