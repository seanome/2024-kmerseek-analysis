  qfo_dedup_table: { order: 580 }
  # 4. Where a correct call lands.
  qfo_boundary: { order: 700 }
  qfo_boundary_dots: { order: 705 }
  # 5. How far back in time, and how far apart in sequence. The pinned arm is named first because the sections after it mark it.
