# MultiQC settings for the QfO Pfam region benchmark report.
#
# The sections themselves are written by bin/build_multiqc_inputs.py as *_mqc.json --
# machine-generated, one file per plot. This file holds only what a person edits: the
# title, the order sections appear in, and the report-wide plot settings.
#
# Section ids here must match the ids that script writes. An id listed but not produced
# is skipped with a debug message, so listing every truth set (pfam, swissprot, pfamn,
# mcsa) is safe even when a run builds only some of them.

title: "QfO Pfam region benchmark"
subtitle: "Domain finding across nine target proteomes: which stretch of a human protein is a PF00001, and did the tool find it"
intro_text: >
  Every tool here searches human query proteins against a Quest-for-Orthologs target
  proteome and reports aligned regions. Each region becomes a domain call by transferring
  the Pfam families annotated on the overlapped target interval onto the query interval,
  then scoring that call against the human protein's own domain instances. Right family in
  the wrong place counts as a false positive. This is not pair-level orthology: a tool
  that finds the correct protein but misplaces the region scores no better than a miss.
  <br><br>
  "Dark" means two different things in this benchmark and they have to be stated
  separately, because the data answers them in opposite directions.
  <b>Dark by divergence</b> is a domain whose closest same-family relative is far away in
  evolutionary time or in percent identity. That is where a coarse alphabet earns its
  keep: read the Divergence and Divergence-retention sections, where the fraction of Fmax
  an arm keeps out to the most distant proteome is a function of how many amino-acid
  classes its alphabet collapses to, on one engine with nothing else varying.
  <b>Dark by disorder</b> is a domain with no confident structure behind it. There, this
  method does not win. On both disorder axes the coarse-alphabet arms fall off faster than
  hhblits, phmmer and foldseek do, and the sequence-only axis, which shares neither the
  AlphaFold-modelling confound nor the shallow-MSA confound, says the same thing as the
  pLDDT one. That half of the claim does not survive its own measurement and is not made
  here.
  <br><br>
  What the model-confidence bands show instead is a regime. Read across every band rather
  than only at the disordered end, the coarse-alphabet arms are non-monotone: weakest where
  the structure is most confident, strongest in the middle. The Model-confidence regime
  section is that shape, and it is a claim about complementarity with the structure
  methods rather than about replacing them.

report_comment: >
  Numbers are read off <code>all_domain_metrics.parquet</code> and the Nextflow trace from
  the same run. Accuracy sections use the held-out half of the Pfam families, because the
  sweep picks its best alphabet and k-mer size on the other half and reporting the winner
  on the data that chose it is optimistically biased.
  <br><br>
  No number in this report carries a sampling error. Every value is a mean over target
  proteomes with no resampling behind it, so a gap narrower than the species-to-species
  spread the leaderboards report as an SD is not a result. Which kmerseek arm a figure
  draws also depends on that figure's own ranking metric and truth set, so an arm followed
  from one section to the next is not necessarily the same arm; pass
  <code>--canonical-variant</code> to pin one and mark it everywhere.

# Not a sequencing run: nothing here is a FASTQ and the sections are plots, not per-sample
# QC. Turning these off removes UI that would only mislead.
show_analysis_paths: false
show_analysis_time: true
skip_generalstats: false

# Written to multiqc_plots/ as png, svg and pdf. The svg is the one that goes in a figure.
export_plots: true

# The sweep is 113 alphabet x ksize combos x 2 low-complexity arms. The low-complexity
# axis is no longer a reporting dimension -- at each alphabet's own best k the filter is
# worth under 0.001 Fmax everywhere in the sweep -- but both arms are still SCORED, and a
# leaderboard is already one row per tool. Leave headroom for a run that widens.
max_table_rows: 2000

# Plotly rather than a flat image, however many series a plot ends up with. These are
# meant to be explored -- hovering a point to find which alphabet and k it is, is the
# entire reason the sweep is plotted rather than tabulated.
plots_force_interactive: true
plots_flat_numseries: 100000

# Render every plot on load instead of leaving a "Show plot" button behind the resource
# scatters, which carry one point per task and trip the default limit of 100 immediately.
plots_defer_loading_numseries: 100000
# The deprecated spelling of the same limit. The banner warning readers they may need to
# press "Show plot" is still driven by this one, so both have to be raised.
num_datasets_plot_limit: 100000

table_columns_visible:
  qfo_general_stats: true

# Sections inside a module are sorted by ascending order value, so the frontier gets the
# smallest number. (Whole modules sort the other way round -- this report is one module,
# so only this direction matters here.) An id listed but not produced is skipped.
report_section_order:
  # Reachability first: 43.9% of the answer key has no same-family instance in the
  # target proteome, and every Fmax below divides by the reachable part. The reader
  # meets that denominator before any leaderboard built on it.
  qfo_reachability: { order: 5 }
  qfo_frontier: { order: 10 }
  qfo_search_cost: { order: 12 }
  qfo_search_cost_table: { order: 13 }
  qfo_capability: { order: 20 }
  qfo_leaderboard_swissprot: { order: 30 }
  qfo_leaderboard_pfamn: { order: 40 }
  qfo_leaderboard_mcsa: { order: 50 }
  qfo_leaderboard_pfam: { order: 60 }
  qfo_truth_provenance: { order: 70 }
  qfo_truthsets: { order: 80 }
  qfo_cafa: { order: 90 }
  qfo_threshold: { order: 100 }
  qfo_boundary: { order: 110 }
  # The same numbers as qfo_boundary drawn as one labelled point per arm, so it goes
  # directly after the table it re-reads. 110 is taken and a plot sharing a number with a
  # table renders the table first -- see the note at 170 -- so it gets its own integer.
  qfo_boundary_dots: { order: 111 }
  qfo_pr_curve: { order: 120 }
  qfo_recall_at_precision: { order: 121 }
  qfo_recall_at_precision_table: { order: 122 }
  qfo_call_volume: { order: 123 }
  qfo_call_volume_table: { order: 124 }
  qfo_roc_curve: { order: 130 }
  qfo_identity: { order: 140 }
  # Fmax across the pLDDT bands as a shape, next to the twilight-zone axis it is read
  # against. Plot first, then its table on the next integer -- sharing a number renders
  # the TABLE first, which is the failure the note at 170 records.
  qfo_plddt_regime: { order: 141 }
  qfo_plddt_regime_table: { order: 142 }
  # Which arm is pinned, named before the sections that mark it.
  qfo_canonical: { order: 145 }
  qfo_divergence: { order: 150 }
  # The identity/divergence pair, immediately ahead of the fuller divergence panel at
  # 150 that they narrow to one metric on two axes. Two sections rather than one
  # two-panel figure because MultiQC has no side-by-side layout; they share a pinned y
  # range instead, which is the only thing a shared axis was for. They must stay
  # adjacent: the identity panel is read against the Mya panel or not at all.
  # Ahead of the identity pair and the full sweep: five lines with cost on the label is
  # the comparison a reader arrives with; 147 keeps it adjacent to both.
  qfo_divergence_annotated: { order: 147 }
  qfo_identity_pair_mya: { order: 148 }
  qfo_identity_pair_pident: { order: 149 }
  qfo_tool_by_species_swissprot: { order: 151 }
  qfo_tool_by_species_table_swissprot: { order: 152 }
  qfo_tool_by_species_pfamn: { order: 153 }
  qfo_tool_by_species_table_pfamn: { order: 154 }
  qfo_tool_by_species_mcsa: { order: 155 }
  qfo_tool_by_species_table_mcsa: { order: 156 }
  qfo_tool_by_species_pfam: { order: 157 }
  qfo_tool_by_species_table_pfam: { order: 158 }
  qfo_species_winners_swissprot: { order: 162 }
  qfo_species_winners_pfamn: { order: 164 }
  qfo_species_winners_mcsa: { order: 166 }
  qfo_species_winners_pfam: { order: 168 }
  # Winning encoding vs divergence: the same x axis as qfo_divergence (150), so it belongs
  # with that block rather than at the end. Each plot is followed by its own table, and the
  # order has to be an int -- order_modules_and_sections asserts it -- so two sections
  # cannot share a slot and take their positions from discovery order. They do not: giving
  # a plot and its table the same number rendered the TABLE first. Each heatmap is now
  # followed by its own bits-per-k-mer strip plot rather than by a winner table: the
  # winner tables are gone, because the margin over the runner-up is in the third
  # decimal and naming one encoding asserted a precision the sweep does not have.
  qfo_encoding_divergence_swissprot: { order: 170 }
  qfo_bits_budget_swissprot: { order: 171 }
  qfo_encoding_divergence_pfamn: { order: 172 }
  qfo_bits_budget_pfamn: { order: 173 }
  qfo_encoding_divergence_mcsa: { order: 174 }
  qfo_bits_budget_mcsa: { order: 175 }
  qfo_encoding_divergence_pfam: { order: 176 }
  qfo_bits_budget_pfam: { order: 177 }
  qfo_alphabet: { order: 178 }
  qfo_alphabet_dose_response: { order: 179 }
  qfo_alphabet_dose_response_table: { order: 180 }
  # Divergence retention against alphabet size: the alphabet axis the grid above sweeps,
  # asked the other way round -- what each alphabet KEEPS out to the most diverged
  # proteome rather than which one won. It sits with the alphabet block rather than beside
  # qfo_divergence at 150, because no run of eight free integers survives up there. Each
  # plot takes the integer immediately before its own table: sharing a number renders the
  # TABLE first, which is the failure the note at 170 records.
  qfo_retention_swissprot: { order: 181 }
  qfo_retention_table_swissprot: { order: 182 }
  qfo_retention_pfamn: { order: 183 }
  qfo_retention_table_pfamn: { order: 184 }
  qfo_retention_mcsa: { order: 185 }
  qfo_retention_table_mcsa: { order: 186 }
  qfo_retention_pfam: { order: 187 }
  qfo_retention_table_pfam: { order: 188 }
  # qfo_lowcomplexity_bars is gone, not renumbered: the toggle's effect at each alphabet's
  # own best k is under 0.001 Fmax everywhere in the sweep, so the 19-panel switcher and the
  # per-alphabet delta bars both collapsed into the single alphabet x k grid at 190.
  qfo_lowcomplexity: { order: 190 }
  # The ceiling block shifts up one to open 196 for qfo_ceiling_crossover, which re-reads
  # the three feature-type heatmaps and therefore has to follow them and precede the
  # recognition pair at 197. MultiQC's order must be an INT -- order_modules_and_sections
  # asserts it -- so there is no 196.5 to slot into, and the way to insert a section
  # between two consecutive integers is to move the block, not to fractionalise.
  qfo_ceiling_length: { order: 191 }
  qfo_ceiling_length_by_k: { order: 192 }
  qfo_ceiling_feature_type: { order: 193 }
  qfo_ceiling_feature_type_coverage: { order: 194 }
  qfo_ceiling_feature_type_point: { order: 195 }
  qfo_ceiling_crossover: { order: 196 }
  qfo_ceiling_recognition: { order: 197 }
  qfo_ceiling_recognition_k: { order: 198 }
  # The same two quantities as qfo_ceiling_recognition against alphabet cardinality, so it
  # belongs immediately after that pair. There were no free integers left between 198 and
  # 200, and order_modules_and_sections asserts an int -- see the note at 170 above --
  # so qfo_ceiling_bpe and qfo_grayzone move up to open ten. Each plot is followed by its
  # own table on the next integer, never sharing one: a plot and its table on the same
  # number renders the TABLE first, which is the failure that note records.
  qfo_ceiling_cardinality_swissprot: { order: 199 }
  qfo_ceiling_cardinality_table_swissprot: { order: 200 }
  qfo_ceiling_cardinality_pfamn: { order: 201 }
  qfo_ceiling_cardinality_table_pfamn: { order: 202 }
  qfo_ceiling_cardinality_mcsa: { order: 203 }
  qfo_ceiling_cardinality_table_mcsa: { order: 204 }
  qfo_ceiling_cardinality_pfam: { order: 205 }
  qfo_ceiling_cardinality_table_pfam: { order: 206 }
  qfo_ceiling_bpe: { order: 207 }
  qfo_grayzone: { order: 208 }
  qfo_run_summary: { order: 210 }
  qfo_kmer_spectra: { order: 211 }
  qfo_kmer_spectra_table: { order: 212 }
  # The supplementary reachability panels, one per non-lead truth set. The lead one
  # renders as bare qfo_reachability at 5.
  qfo_reachability_swissprot: { order: 213 }
  qfo_reachability_pfamn: { order: 214 }
  qfo_reachability_mcsa: { order: 215 }
  qfo_reachability_pfam: { order: 216 }
  qfo_res_cpu: { order: 220 }
  qfo_res_walltime: { order: 230 }
  qfo_res_throughput: { order: 240 }
  qfo_res_memory: { order: 250 }
  qfo_res_kmerseek_memory: { order: 260 }
  qfo_res_efficiency: { order: 270 }
  qfo_res_io: { order: 280 }
  qfo_res_status: { order: 290 }
  qfo_resources_missing: { order: 300 }
  qfo_citations: { order: 310 }
