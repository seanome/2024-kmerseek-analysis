# MultiQC settings for the QfO Pfam region benchmark report.
#
# The sections themselves are written by bin/build_multiqc_inputs.py as *_mqc.json --
# machine-generated, one file per plot. This file holds only what a person edits: the
# title, the order sections appear in, and the report-wide plot settings.
#
# Section ids here must match the ids that script writes. See the note above
# report_section_order for why every id has to be listed rather than only the ones being
# moved.

title: "QfO Pfam region benchmark"
subtitle: "Domain finding across Quest-for-Orthologs target proteomes: which stretch of a human protein is a given Pfam domain, and did the tool find it"
# The first screen (what kmerseek is, the question, the answer with its numbers, the
# caveats, the reading order, the words) is `intro_text`, and it is WRITTEN BY THE BUILDER
# into multiqc_in/report_header.yaml, which multiqcReport passes as a later --config. It is
# not here because the answer carries numbers, and a number typed into this file is stale
# by the next run. Until 2026-09-19 this file carried a disorder-direction claim from an
# earlier run that the data of later runs reversed.

report_comment: >
  Only the Pfam answer key is split in half: the sweep picks kmerseek's alphabet and k on
  one half and its Pfam accuracy is read on the other, because reporting the winner on the
  data that chose it is optimistically biased. The Swiss-Prot and Pfam-N keys are not
  swept and are scored whole. Which kmerseek arm a figure draws depends on that figure's
  own ranking metric and answer key, so the arm marked &#9733; is drawn in every figure
  and is the one to follow from section to section. How the report was built, with every
  file and flag name, is in "Reproducing this report" at the end.

# Not a sequencing run: nothing here is a FASTQ and the sections are plots, not per-sample
# QC. Turning these off removes UI that would only mislead.
show_analysis_paths: false
show_analysis_time: true
# The top-of-page General Statistics element is off: it cannot be placed below a section,
# and the reader meets the data flow first. The same table is the section right after it.
skip_generalstats: true

# Written to multiqc_plots/ as png, svg and pdf. The svg is the one that goes in a figure.
export_plots: true

# The sweep is 113 alphabet x ksize combos x 2 low-complexity arms. The low-complexity
# axis is no longer a reporting dimension -- at each alphabet's own best k the filter is
# worth under 0.001 Fmax everywhere in the sweep -- but both arms are still SCORED, and a
# leaderboard is already one row per tool. Leave headroom for a run that widens.
max_table_rows: 2000

# Plotly rather than a flat image, however many series a plot ends up with. These are
# meant to be explored -- hovering a point to find which alphabet and k it is, is the
# entire reason the sweep is plotted rather than tabulated.
plots_force_interactive: true
plots_flat_numseries: 100000

# Render every plot on load instead of leaving a "Show plot" button behind the resource
# scatters, which carry one point per task and trip the default limit of 100 immediately.
plots_defer_loading_numseries: 100000
# The deprecated spelling of the same limit. The banner warning readers they may need to
# press "Show plot" is still driven by this one, so both have to be raised.
num_datasets_plot_limit: 100000

# Sections inside a module are sorted by ascending order value. EVERY section this report
# can write is listed below, with no gaps in what is covered, and that completeness is the
# point rather than tidiness.
#
# MultiQC gives an UNLISTED section a default position of 10, 20, 30 ... in discovery
# order, and then sorts the listed and unlisted together on one scale. So a partial list
# does not layer over the defaults, it competes with them: with ~90 sections the unlisted
# ones run out past 900, and in the midi-plus report that put the whole ceiling block and
# every MHC panel AFTER the citations, which were sitting at 310 and were supposed to be
# last. Nothing was misnumbered -- the numbers were being compared against a scale that
# had grown underneath them. Listing everything removes the second scale.
#
# Consequences of that, worth keeping in mind when editing:
#   - A new section MUST be added here, or it lands somewhere arbitrary in the middle.
#   - Order values must be ints; order_modules_and_sections asserts it. There is no
#     fraction to slot between two neighbours, which is why these are spaced by 10.
#   - A plot and its table must not share a number: sharing one renders the TABLE first.
#   - An id listed but not produced is skipped with a debug message, so listing every
#     truth set (pfam, pfamn, swissprot, mcsa) is safe when a run builds only some.
#
# The order is the story, one group per question, in the order a reader needs the
# answers (rewritten 2026-09-19; before that the cost sections, which are empty in any
# run without a trace, came fourth, and the recognition-vs-placement pair was split
# across two modules). Numbers are spaced by 5 within a group and each group starts 200
# above the last, so a section can be inserted without renumbering the file.
report_section_order:
  # MODULES first. The two custom-content modules (the main report, the supplement) sort
  # among themselves with the LARGEST order first, the reverse of how the sections inside
  # a module sort. The main module is highest. (The alphabet block was a third module,
  # qfo_ceiling, until 2026-09-19; it is now a run of sections inside the main module.)
  qfo_region: { order: 1000 }
  qfo_region_supp: { order: 800 }

  # 1. Read first: what was done, the arms at a glance, how to read the numbers, what the run concluded.
  # The explainers come before the at-a-glance table so Fmax is defined before the first
  # table that uses it (swapped 2026-09-20).
  qfo_overview: { order: 100 }
  qfo_metric_explainers: { order: 105 }
  qfo_general_stats: { order: 110 }
  qfo_conclusions: { order: 115 }
  # 2. The answer keys: where the truth comes from, and what a target proteome can supply at all.
  qfo_truth_provenance: { order: 300 }
  qfo_truthsets: { order: 305 }
  qfo_reachability: { order: 310 }
  qfo_reachability_swissprot: { order: 315 }
  qfo_reachability_pfamn: { order: 320 }
  qfo_reachability_mcsa: { order: 325 }
  qfo_reachability_pfam: { order: 330 }
  # 3. The comparison, and whether it is fair: leaderboards, threshold-free metrics, then what each arm had to report to get there.
