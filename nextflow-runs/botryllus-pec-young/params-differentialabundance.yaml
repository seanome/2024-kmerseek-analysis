# nf-core/differentialabundance 2.0.0 with its rnaseq profile: DESeq2, treated vs control
# within each of six time windows, colony as a blocking factor. One model is fitted to all
# 52 young libraries (design ~ colony + group, group = window and treatment), so windows
# with 2 or 3 libraries a side share the variance estimate of the larger ones.
# input (samples.csv), contrasts (contrasts.csv), matrix, feature_length_matrix and outdir
# are given on the command line by run_pipelines.sh, as absolute paths. run_each_alone.sh
# uses this file too, and overrides the settings it needs to fit each comparison alone.

study_name: botryllus_pec_young
observations_id_col: sample
gtf: /home/groups/ayeletv/Index_Genome_New_April2024/ReferenceFiles/Annotated_Merge_Botryllus.sofMask_CorrectedNames_FullNames.gtf
features_metadata_cols: gene_id,gene_name

# DESeq2's default size factors (median of ratios) use only genes counted in every library
# and stop with an error when there are none. Libraries with a few hundred read pairs make
# that likely, so size factors use DESeq2's "poscounts" estimator, which skips the zeros.
deseq2_sf_type: poscounts

# The report's clustering heatmap groups libraries by Spearman correlation over the 500
# most variable genes. On raw counts, SRR32233947 (236 read pairs) has 0 in all 500, so
# its correlation is undefined and the heatmap stops with "NA/NaN/Inf in foreign function
# call" (run of 2026-10-27). Over all genes it has some counts, so the heatmap uses all
# genes (-1). Only the report reads this setting.
# Leaving raw counts out of exploratory_assay_names instead (tried 2026-11-01) does not
# work: the exploratory plots and the Shiny app are always given all three count tables
# and stop when the list of names is shorter.
exploratory_n_features: -1

# The report colours its per-gene boxplots by the contrast column (group: 12 values) but
# sizes the colour list from the main grouping column, which by default (auto_pca) is the
# column most tied to the first principal component, here one with fewer values; ggplot
# then stops with "Insufficient values in manual scale". Using the contrast column as the
# main grouping gives both the same 12 values.
exploratory_main_variable: contrasts
