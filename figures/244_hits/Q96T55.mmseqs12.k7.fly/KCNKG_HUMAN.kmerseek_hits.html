<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCNKG_HUMAN kmerseek hits</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --plane: #f9f9f7; --wash: #f1f0eb; --wash2: #e9e8e2;
    --ink: #0b0b0b; --secondary: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10);
    --h-fill: #f9dfd0; --h-edge: #eb6834; --h-ink: #6b2a10;
    --p-fill: #d9e7f8; --p-edge: #2a78d6; --p-ink: #123b6b;
    --id0: #b3b2a7; --id1: #8b8980; --id2: #65635d; --id3: #3d3c39; --id4: #0b0b0b;
    --cov: #c3c2b7; --cov5: #52514e;
    --domain: #efeee9; --domain-edge: #898781;
    --structure: #1baf7a; --flash: #fff3c4; --focus: #2a78d6;
    --sans: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
    --namew: 270px; --plotw: 420px;
    --cols: 30px var(--namew) 46px 42px 56px 64px 54px 72px 46px minmax(220px, 1fr);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19; --plane: #0d0d0d; --wash: #242422; --wash2: #2c2c2a;
      --ink: #ffffff; --secondary: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
      --h-fill: #4a2411; --h-edge: #d95926; --h-ink: #f7c2a8;
      --p-fill: #12345e; --p-edge: #3987e5; --p-ink: #bcd5f5;
      --id0: #4f4e4a; --id1: #75746d; --id2: #9b9990; --id3: #c3c2b7; --id4: #f4f3ee;
      --cov: #383835; --cov5: #9b9990;
      --domain: #2c2c2a; --domain-edge: #898781;
      --structure: #199e70; --flash: #4a3f12; --focus: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --plane: #0d0d0d; --wash: #242422; --wash2: #2c2c2a;
    --ink: #ffffff; --secondary: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
    --h-fill: #4a2411; --h-edge: #d95926; --h-ink: #f7c2a8;
    --p-fill: #12345e; --p-edge: #3987e5; --p-ink: #bcd5f5;
    --id0: #4f4e4a; --id1: #75746d; --id2: #9b9990; --id3: #c3c2b7; --id4: #f4f3ee;
    --cov: #383835; --cov5: #9b9990;
    --domain: #2c2c2a; --domain-edge: #898781;
    --structure: #199e70; --flash: #4a3f12; --focus: #3987e5;
  }
  * { box-sizing: border-box; }
  html { background: var(--plane); }
  body { margin: 0; background: var(--plane); color: var(--ink); font: 13px/1.4 var(--sans); }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }
  .icon { width: 18px; height: 18px; fill: currentColor; vertical-align: -4px; flex: none; }
  .icon.s { width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* Sticky header: title, filters, ruler and column names stay while the rows scroll. */
  header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent);
               -webkit-backdrop-filter: blur(10px) saturate(160%); backdrop-filter: blur(10px) saturate(160%);
               border-bottom: 1px solid var(--grid); box-shadow: 0 1px 0 var(--ring); }
  .titlebar { display: flex; align-items: center; gap: 14px; padding: 8px 14px 6px; flex-wrap: wrap; }
  .titlebar h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; }
  .titlebar h1 .dim { color: var(--secondary); font-weight: 400; margin-left: 6px; }
  .titlebar .stats { color: var(--secondary); font-size: 12px; flex: 1 1 auto; min-width: 200px; }
  .titlebar .actions { display: flex; align-items: center; gap: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 6px; color: var(--secondary); font-size: 12px; }
  .btn:hover { background: var(--wash); color: var(--ink); }
  .btn[aria-pressed="true"] { background: var(--wash2); color: var(--ink); }
  .menu { position: relative; }
  .menu ul { position: absolute; right: 0; top: 100%; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--surface);
             border: 1px solid var(--grid); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.14); min-width: 260px; display: none; z-index: 30; }
  .menu.open ul { display: block; }
  .menu li button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; border-radius: 5px; font-size: 12.5px; }
  .menu li button:hover { background: var(--wash); }
  .menu li button .k { margin-left: auto; color: var(--muted); font-size: 11px; }
  .menu li.sep { border-top: 1px solid var(--grid); margin: 4px 0; }

  .filters { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 2px 14px 8px; font-size: 12px; color: var(--secondary); }
  .filters label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .search { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--axis); border-radius: 6px; padding: 2px 6px; background: var(--surface); }
  .search input { border: 0; background: none; outline: none; width: 190px; font-size: 12.5px; }
  .search input::placeholder { color: var(--muted); }
  .filters input[type=number] { width: 4.2em; border: 1px solid var(--axis); border-radius: 5px; padding: 2px 4px; background: var(--surface); }
  .filters select { border: 1px solid var(--axis); border-radius: 5px; padding: 2px 4px; background: var(--surface); }
  .chip { border: 1px solid var(--axis); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--secondary); background: var(--surface); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .chip:hover { border-color: var(--secondary); }
  .count { color: var(--secondary); margin-left: auto; white-space: nowrap; }
  .count b { color: var(--ink); font-weight: 600; }

  /* One grid template for the ruler, the column names and every row, so the tracks share an x axis. */
  .g { display: grid; grid-template-columns: var(--cols); column-gap: 8px; align-items: center; padding: 0 14px; }
  .ruler { border-top: 1px solid var(--grid); padding-top: 6px; padding-bottom: 2px; align-items: end; }
  .ruler .lbl { color: var(--secondary); font-size: 12px; line-height: 1.3; grid-column: 2 / 10; align-self: end; padding-bottom: 6px; }
  .ruler .lbl b { color: var(--ink); font-weight: 600; }
  .ruler .lbl .n { display: block; color: var(--muted); }
  .colhead { padding-top: 4px; padding-bottom: 4px; border-bottom: 1px solid var(--axis); font-size: 12px; color: var(--secondary); position: relative; }
  .colhead .num { text-align: right; }
  .colhead button.sort { display: inline-flex; align-items: center; gap: 1px; color: inherit; border-radius: 4px; padding: 1px 2px; white-space: nowrap; }
  .colhead button.sort:hover { color: var(--ink); background: var(--wash); }
  .colhead button.sort[aria-sort] { color: var(--ink); font-weight: 600; }
  .colhead button.sort .icon { width: 14px; height: 14px; visibility: hidden; }
  .colhead button.sort[aria-sort] .icon { visibility: visible; }
  .colhead .num button.sort { justify-content: flex-end; width: 100%; }
  .colhead .handle { user-select: none; position: absolute; left: calc(14px + 30px + 8px + var(--namew) + 1px); top: 0; bottom: 0; width: 10px; cursor: col-resize; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .colhead .handle:hover, .colhead .handle.on { color: var(--ink); }
  .colhead .handle .icon { transform: rotate(90deg); width: 14px; height: 14px; }

  main { background: var(--surface); }
  .row { border-bottom: 1px solid var(--grid); cursor: pointer; min-height: 30px; position: relative; }
  .row:hover { background: var(--wash); }
  .row.open { background: var(--wash2); }
  .row.open::before, .row.cursor::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ink); }
  .row.cursor::before { background: var(--focus); }
  .row .rank { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .row .name { min-width: 0; padding: 4px 0; }
  .row .name .d { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .name .s { color: var(--secondary); font-size: 11.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
  .row .name .s a { color: var(--secondary); text-decoration: none; display: inline-flex; align-items: center; }
  .row .name .s a:hover { color: var(--ink); }
  .tag { display: inline-block; border: 1px solid var(--axis); border-radius: 4px; padding: 0 4px; font-size: 10.5px; line-height: 15px; color: var(--secondary); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .num.dim { color: var(--muted); }
  .track svg { display: block; overflow: visible; }
  rect.bar { stroke: var(--surface); stroke-width: 1; }
  rect.bar.id0 { fill: var(--id0); } rect.bar.id1 { fill: var(--id1); } rect.bar.id2 { fill: var(--id2); } rect.bar.id3 { fill: var(--id3); } rect.bar.id4 { fill: var(--id4); }
  rect.bar:hover { stroke: var(--focus); stroke-width: 1.5; }
  text.more { font-size: 10px; font-weight: 600; fill: var(--secondary); font-family: var(--sans); }
  line.tick { stroke: var(--grid); stroke-width: 1; }
  text.ax { font-size: 10.5px; fill: var(--muted); font-family: var(--sans); }
  line.axis { stroke: var(--axis); }
  path.cov { fill: var(--cov); } path.cov5 { fill: var(--cov5); }
  rect.dom { fill: var(--domain); stroke: var(--domain-edge); stroke-width: 0.8; }
  rect.dom.on { stroke: var(--ink); stroke-width: 1.5; }
  rect.dom:hover { stroke: var(--ink); }
  text.dom { font-size: 11px; fill: var(--secondary); font-family: var(--sans); pointer-events: none; }
  line.pl { stroke: var(--domain-edge); stroke-width: 1.2; }
  text.qmark { font-size: 10.5px; fill: var(--muted); font-family: var(--sans); }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--secondary); font-size: 12px; padding: 6px 14px; border-bottom: 1px solid var(--grid); background: var(--surface); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .ramp { display: inline-flex; gap: 1px; }
  .legend .ramp i { width: 14px; height: 9px; display: inline-block; }
  .legend .ramp i.id0 { background: var(--id0); } .legend .ramp i.id1 { background: var(--id1); } .legend .ramp i.id2 { background: var(--id2); } .legend .ramp i.id3 { background: var(--id3); } .legend .ramp i.id4 { background: var(--id4); }
  .legend .sw { width: 14px; height: 12px; display: inline-block; border: 1px solid; border-radius: 2px; }
  .legend .sw.h { background: var(--h-fill); border-color: var(--h-edge); } .legend .sw.p { background: var(--p-fill); border-color: var(--p-edge); }
  .legend .cov-sw { display: inline-block; width: 14px; height: 12px; position: relative; }
  .legend .cov-sw::before { content: ""; position: absolute; left: 0; width: 6px; top: 0; bottom: 0; background: var(--cov); }
  .legend .cov-sw::after { content: ""; position: absolute; left: 8px; width: 6px; top: 6px; bottom: 0; background: var(--cov5); }
  .legend .trk { width: 26px; height: 12px; display: inline-block; position: relative; }
  .legend .trk::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; border-top: 1px solid var(--domain-edge); }
  .legend .trk::after { content: ""; position: absolute; left: 8px; width: 10px; top: 1px; height: 9px; background: var(--domain); border: 1px solid var(--domain-edge); }
  .legend .path { width: 22px; height: 0; border-top: 2px solid var(--structure); display: inline-block; }
  .legend .dotm { width: 8px; height: 8px; border-radius: 50%; background: var(--id1); display: inline-block; }
  .legend b.mid { font-family: var(--mono); font-weight: 700; color: var(--ink); }

  /* Expanded row: dot plot on the left, alignments on the right, a drag handle between. */
  .panel { border-bottom: 1px solid var(--grid); background: var(--surface); }
  .panel .ptool { display: flex; align-items: center; gap: 8px; padding: 6px 14px 4px 24px; font-size: 12.5px; color: var(--secondary); border-bottom: 1px solid var(--grid); }
  .panel .ptool b { color: var(--ink); font-weight: 600; }
  .panel .ptool .sp { flex: 1; }
  .split { display: grid; grid-template-columns: var(--plotw) 10px minmax(0, 1fr); align-items: start; }
  .split .plot { padding: 8px 0 8px 14px; overflow: auto; }
  .split .vh { user-select: none; cursor: col-resize; align-self: stretch; display: flex; align-items: center; justify-content: center; color: var(--muted); border-left: 1px solid var(--grid); }
  .split .vh:hover, .split .vh.on { color: var(--ink); background: var(--wash); }
  .split .alns { padding: 8px 14px 12px 10px; overflow-x: auto; min-width: 0; }
  .plot svg text { font-family: var(--sans); font-size: 11px; fill: var(--secondary); }
  .plot svg text.num { font-size: 12px; font-weight: 700; fill: var(--ink); font-family: var(--sans); }
  .plot .run-seg, .plot .run-num { cursor: pointer; }
  .plot svg .area { cursor: crosshair; }
  .plot svg line.cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
  .plot svg .run-seg.hot { stroke-width: 6; }
  .plot svg circle.hot { r: 4.5; }
  .block.hot { background: var(--wash); }
  .plot .sub { color: var(--secondary); font-size: 12px; margin: 0 0 6px; }
  .block { margin: 0 0 10px; padding: 6px 8px; border-radius: 6px; transition: background .6s; }
  .block.flash { background: var(--flash); transition: none; }
  .block h3 { font-size: 12.5px; font-weight: 600; margin: 0 0 2px; color: var(--ink); }
  .block h3 .w { font-weight: 400; color: var(--secondary); }
  .block .wrap { overflow-x: auto; }
  .chunk { display: grid; grid-template-columns: max-content max-content max-content; column-gap: 6px; row-gap: 2px; align-items: center; margin: 0 0 8px; white-space: nowrap; }
  .chunk .lab { font-size: 11px; color: var(--secondary); text-align: right; }
  .chunk .lab.r { text-align: left; }
  .cells { font: 12px/15px var(--mono); color: var(--ink); letter-spacing: 0; }
  .cells i { display: inline; font-style: normal; padding: 1px 3px; border: 0.5px solid transparent; border-radius: 2px; }
  .cells i.h { background: var(--h-fill); border-color: var(--h-edge); color: var(--h-ink); }
  .cells i.p { background: var(--p-fill); border-color: var(--p-edge); color: var(--p-ink); }
  .cells i.x { border-color: var(--axis); }
  .cells i.same { font-weight: 700; }
  .cells.enc i { font-size: 11.5px; background: none; border-color: transparent; }
  .cells.marks i { color: var(--secondary); background: none; border-color: transparent; }
  .cells i.flank { opacity: .55; }
  .cells.under i.run { box-shadow: 0 3px 0 0 var(--ink); }
  .cells i.hit { outline: 2px solid var(--ink); outline-offset: -1px; background: var(--flash); }
  /* Full sequences under an open row: runs underlined in the bar's shade, the rest faded. */
  .seqs { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 8px; row-gap: 6px; align-items: start; padding: 6px 14px 12px; border-top: 1px solid var(--grid); }
  .seqs .lab { font-size: 11px; color: var(--secondary); text-align: right; white-space: nowrap; padding-top: 2px; }
  .seqs .lab small { display: block; color: var(--muted); }
  .seqs .cells { line-height: 19px; word-break: break-all; }
  .seqs .cells i.run { cursor: pointer; }
  .cells i.hot { outline: 2px solid var(--ink); outline-offset: -1px; background: var(--flash); }
  .none { color: var(--secondary); padding: 8px 14px; }
  .shown { color: var(--secondary); font-size: 12px; margin: 4px 0 0; }

  #tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--grid); border-radius: 6px; padding: 6px 9px;
         font-size: 12px; line-height: 1.35; box-shadow: 0 4px 14px rgba(0,0,0,.16); display: none; white-space: nowrap; z-index: 40; max-width: 420px; }
  #tip b { font-weight: 600; }
  #tip .m { font-family: var(--mono); }
  #tip .t { color: var(--secondary); }
  .help { position: fixed; right: 14px; top: 46px; width: 440px; max-width: calc(100vw - 28px); background: var(--surface); border: 1px solid var(--grid); border-radius: 10px;
          box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 12px 14px; z-index: 35; display: none; font-size: 12.5px; color: var(--secondary); }
  .help.open { display: block; }
  .help h2 { font-size: 13px; margin: 0 0 6px; color: var(--ink); }
  .help dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; }
  .help dt { color: var(--ink); font-weight: 600; }
  .help dd { margin: 0; }
  .help kbd { font: 11px var(--mono); border: 1px solid var(--axis); border-radius: 3px; padding: 0 4px; color: var(--ink); }
  .empty { padding: 30px 14px; color: var(--secondary); }
  .empty button { color: var(--ink); text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .block { transition: none; } }
  @media print { header.top { position: static; -webkit-backdrop-filter: none; backdrop-filter: none; } .actions, .filters, .colhead .handle, .split .vh { display: none !important; } }
</style>

// ---------- rows ----------
function lanes(runs) {

  const top = extra.length ? 10 : (H - (n * 7 - 1)) / 2;
  for (const d of Q.domains) svg.appendChild(svgEl("rect", { x: X(d.start), y: 0, width: X(d.end + 1) - X(d.start), height: H, fill: "var(--domain)", opacity: 0.35 }));
  row.runs.forEach((r, i) => {
    if (lane[i] < 0) return;

    const rect = svgEl("rect", { class: "bar id" + bin(id.identical / id.of), x: X(r.query_start + 1), y: top + lane[i] * 7, width: Math.max(r.length * state.tw / QL, 2), height: 6, rx: 1 });

    svg.appendChild(rect);
  });
  if (extra.length) {

  const vars = {}; for (const v of ["ink", "secondary", "muted", "grid", "axis", "surface", "domain", "domain-edge", "structure", "id0", "id1", "id2", "id3", "id4", "cov", "cov5", "h-fill", "h-edge", "h-ink", "p-fill", "p-edge", "p-ink"]) vars[v] = cs.getPropertyValue("--" + v).trim();
  const fix = s => s.replace(/var\(--([\w-]+)\)/g, (_, v) => vars[v] || "#000");
  for (const n of c.querySelectorAll("*")) for (const a of ["fill", "stroke"]) if (n.hasAttribute(a)) n.setAttribute(a, fix(n.getAttribute(a)));
  const style = svgEl("style", {}, `text{font-family:${cs.getPropertyValue("--sans")};font-size:11px;fill:${vars.secondary}} text.num{font-size:12px;font-weight:700;fill:${vars.ink}} text.ax{font-size:10.5px;fill:${vars.muted}} text.dom{font-size:11px;fill:${vars.secondary}} rect.dom{fill:${vars.domain};stroke:${vars["domain-edge"]};stroke-width:.8} line.pl{stroke:${vars["domain-edge"]};stroke-width:1.2} .cov{fill:${vars.cov}} .cov5{fill:${vars.cov5}} line.axis{stroke:${vars.axis}} rect.bar{stroke:${vars.surface}} rect.bar.id0{fill:${vars.id0}} rect.bar.id1{fill:${vars.id1}} rect.bar.id2{fill:${vars.id2}} rect.bar.id3{fill:${vars.id3}} rect.bar.id4{fill:${vars.id4}} text.more{font-size:10px;font-weight:600;fill:${vars.secondary}} text.lab{font-size:12px;fill:${vars.ink}} text.sub{font-size:10.5px;fill:${vars.secondary}} text.hd{font-size:11px;fill:${vars.secondary}} text.ttl{font-size:14px;font-weight:600;fill:${vars.ink}}`);
  c.insertBefore(style, c.firstChild);
  c.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  c.style.background = vars.surface;

}
function overviewSvg(rows) {
  // The rows shown, as one figure: ruler on top, one line per protein.
  const saved = state.tw; state.tw = 900;
  const LW = 330, NUMW = 270, W = 20 + LW + NUMW + state.tw + 20, top = 150;
  const tracks = rows.map(row => track(row)), heights = tracks.map(t => Math.max(22, Number(t.getAttribute("height")) + 4));
  const H = top + heights.reduce((a, b) => a + b, 0) + 30;
  const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  svg.appendChild(svgEl("text", { class: "ttl", x: 20, y: 24 }, `${Q.label}: runs of shared ${K}-mers (${R.alphabet}) in ${rows.length} proteins`));
  svg.appendChild(svgEl("text", { class: "sub", x: 20, y: 42 }, `bars shaded by identical residues ${IDENT_HOW} (light: under 20%, dark: 80% and over); grey area: database entries with a run over each residue (${R.n_entries} entries), dark area: with ${SOLID} or more identical`));
  const g = svgEl("g", { transform: `translate(${20 + LW + NUMW}, 52)` });
  for (const n of [...rulerSvg().childNodes]) g.appendChild(n);
  svg.appendChild(g);
  const heads = [["#", 20], ["protein", 44], ["aa", 20 + LW + 40], ["runs", 20 + LW + 85], ["longest", 20 + LW + 140], ["% identity", 20 + LW + 210], [PRIMARY ? PRIMARY.label : "", 20 + LW + 260]];
  for (const [t, x] of heads) svg.appendChild(svgEl("text", { class: "hd", x, y: top - 8, "text-anchor": t === "#" || t === "protein" ? "start" : "end" }, t));
  let y = top;
  rows.forEach((row, i) => {
    const RH = heights[i], ty = y + RH / 2 + 4, name = row.description || row.label;
    svg.appendChild(svgEl("text", { class: "sub", x: 20, y: ty }, row.rank));
    svg.appendChild(svgEl("text", { class: "lab", x: 44, y: ty }, name.slice(0, 34) + (name.length > 34 ? "\u2026" : "")));
    const vals = [[row.length, 40], [row.runs.length, 85], [row.best.length, 140], [row.runs.length ? Math.round(row.bestPct) + "%" : "\u2013", 210], [PRIMARY ? fmtScore(row.primary) : "", 260]];
    for (const [v, dx] of vals) svg.appendChild(svgEl("text", { class: "sub", x: 20 + LW + dx, y: ty, "text-anchor": "end" }, v));
    const t = tracks[i], gg = svgEl("g", { transform: `translate(${20 + LW + NUMW}, ${y + (RH - Number(t.getAttribute("height"))) / 2})` });
    for (const n of [...t.childNodes]) gg.appendChild(n);
    svg.appendChild(gg);
    y += RH;
    svg.appendChild(svgEl("line", { x1: 20, x2: W - 20, y1: y, y2: y, stroke: "var(--grid)" }));
  });
  state.tw = saved;
  return svg;
}
function pngOf(svgText, name) {
  const img = new Image(), url = URL.createObjectURL(new Blob([svgText], { type: "image/svg+xml" }));
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = img.width * 2; c.height = img.height * 2;
    const ctx = c.getContext("2d"); ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--surface").trim(); ctx.fillRect(0, 0, c.width, c.height);
    ctx.scale(2, 2); ctx.drawImage(img, 0, 0); URL.revokeObjectURL(url);
    c.toBlob(b => download(name, b, "image/png"), "image/png");
  };
  img.src = url;
}
function doDownload(kind) {
  const rows = visibleRows(), base = `${Q.label}.kmerseek`;
  if (kind === "rows") download(`${base}.hits.tsv`, rowsTsv(rows), "text/tab-separated-values");
  if (kind === "runs") download(`${base}.runs.tsv`, runsTsv(rows), "text/tab-separated-values");
  if (kind === "fasta") download(`${base}.alignments.fasta`, fastaOf(rows), "text/plain");
  if (kind === "json") download(`${base}.json`, JSON.stringify(R), "application/json");
  if (kind === "svg") download(`${base}.overview.svg`, svgString(overviewSvg(rows)), "image/svg+xml");
  if (kind === "png") pngOf(svgString(overviewSvg(rows)), `${base}.overview.png`);
}

// ---------- help ----------
function help() {
  const h = $("help");
  h.appendChild(el("h2", null, "Reading this page"));
  const dl = el("dl");
  const add = (t, d) => { dl.appendChild(el("dt", null, t)); dl.appendChild(el("dd", null, d)); };
  add("alphabet", `${R.moltype ? R.moltype + ", " : ""}${R.alphabet}: ${R.classes.map(c => `${c.symbol} = ${c.label.split(" (")[0]} (${[...c.residues].join(" ")})`).join("; ")}.`);
  add(`shared ${K}-mer`, `${K} consecutive residues with the same ${R.classes.map(c => c.label.split(" (")[0]).join("/")} pattern in query and target.`);
  add("run", `2 or more shared ${K}-mers in a row on one diagonal, so ${K + 1} or more residues with the same pattern.`);
  add("% identity", GAPPED ? "Identical residues in the longest run after gapped alignment of the run and its flanks; the tooltip on a bar gives the count on the run itself too." : "Identical residues in the longest run, counted straight down the run: the alignment is ungapped.");
  add("shared k-mers", `All shared ${K}-mers between the two proteins, in runs or not.`);
  for (const sc of SCORES) add(sc.label, (sc.note || sc.label) + (sc === PRIMARY ? ". Ranks the rows." : "") + (sc.better === "high" ? " Higher is better." : " Lower is better."));
  add("TM-score", "From superposing the two AlphaFold models with USalign, by query length; 0.5 and above usually means the same fold. The dot plot draws USalign's residue pairs as a line.");
  add("shading", "Darker bar = larger identical fraction; the same five steps colour the run segments in the dot plot.");
  add("sequences", "Under an open row, the two full sequences, coloured by class, with each run underlined in the shade of its bar; hover a letter for its position and class, hover or click a run's stretch as in the plot.");
  add("entries", "Database entries of one gene are folded into one row; the tag +n counts the others, hover it to list them.");
  add("sequence box", `Keeps the rows with a run containing the letters, in either protein, and marks them in the alignments; letters from the alphabet only (${ENC_LABEL}) search the encoding instead. The browser's own find works on the alignments too.`);
  h.appendChild(dl);
  h.appendChild(el("h2", null, "Keys")).style.marginTop = "10px";
  const keys = el("div"); keys.innerHTML = "<kbd>j</kbd> <kbd>k</kbd> move between rows, <kbd>Enter</kbd> open or close, <kbd>/</kbd> search, <kbd>Esc</kbd> close what is open";
  h.appendChild(keys);
}

// ---------- wiring ----------
function resetFilters() {
  state.text = ""; state.seq = ""; state.minIdent = 0; state.maxStat = ""; state.reviewed = false; state.noFrag = false; state.regions.clear();
  $("q").value = ""; $("seq").value = ""; $("min-ident").value = 0; $("max-stat").value = ""; $("reviewed").checked = false; $("no-frag").checked = false; render();
}
function measure() {
  if (state.dragging) return;
  const cell = document.querySelector("#colhead .track"); if (!cell) return;
  const w = Math.max(160, Math.floor(cell.getBoundingClientRect().width));
  if (w !== state.tw) { state.tw = w; render(); }
}
function setTheme(mode) {
  if (mode === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", mode);
  try { localStorage.setItem("kmerseek-theme", mode); } catch (e) {}
  const b = $("theme"); b.title = `Theme: ${mode === "auto" ? "follows the system" : mode} (click to change)`;
  b.replaceChildren(icon(mode === "dark" ? "i-light" : "i-dark"));
}
titles(); legend(); help();
$("q").addEventListener("input", e => { state.text = e.target.value; render(); });
$("seq").addEventListener("input", e => {
  state.seq = e.target.value;
  if (seqQuery()) { const hit = ROWS.filter(r => seqRuns(r).length); if (hit.length && hit.length <= 8) for (const r of hit) state.open.add(r.rank); }
  render();
});
$("min-ident").addEventListener("input", e => { state.minIdent = Number(e.target.value) || 0; render(); });
$("max-stat").addEventListener("input", e => { state.maxStat = e.target.value; render(); });
$("reviewed").addEventListener("change", e => { state.reviewed = e.target.checked; render(); });
$("no-frag").addEventListener("change", e => { state.noFrag = e.target.checked; render(); });
$("reset").onclick = resetFilters;
$("expand-all").onclick = () => { for (const r of visibleRows()) state.open.add(r.rank); render(); };
$("collapse-all").onclick = () => { state.open.clear(); render(); };
$("dl-btn").onclick = e => { e.stopPropagation(); const m = $("dl"); m.classList.toggle("open"); $("dl-btn").setAttribute("aria-expanded", m.classList.contains("open")); };
for (const b of document.querySelectorAll("#dl [data-dl]")) b.onclick = () => { $("dl").classList.remove("open"); doDownload(b.dataset.dl); };
document.addEventListener("click", e => { if (!e.target.closest("#dl")) $("dl").classList.remove("open"); if (!e.target.closest("#help, #help-btn")) $("help").classList.remove("open"); });
$("help-btn").onclick = e => { e.stopPropagation(); $("help").classList.toggle("open"); };
let themeMode = "auto"; try { themeMode = localStorage.getItem("kmerseek-theme") || "auto"; } catch (e) {}
setTheme(themeMode);
$("theme").onclick = () => setTheme(themeMode = { auto: "dark", dark: "light", light: "auto" }[themeMode]);
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  const rows = visibleRows(); if (!rows.length) return;
  const i = rows.findIndex(r => r.rank === state.cursor);
  if (e.key === "j" || e.key === "ArrowDown") { state.cursor = rows[Math.min(rows.length - 1, i + 1)].rank; render(); document.querySelector(".row.cursor")?.scrollIntoView({ block: "nearest" }); e.preventDefault(); }
  else if (e.key === "k" || e.key === "ArrowUp") { state.cursor = rows[Math.max(0, i - 1)].rank; render(); document.querySelector(".row.cursor")?.scrollIntoView({ block: "nearest" }); e.preventDefault(); }
  else if (e.key === "Enter" && i >= 0) { toggle(rows[i]); e.preventDefault(); }
  else if (e.key === "/") { $("q").focus(); e.preventDefault(); }
  else if (e.key === "Escape") { $("dl").classList.remove("open"); $("help").classList.remove("open"); if (state.open.size) { state.open.clear(); render(); } }
});
if (R.pair) state.open.add(1);
render();
measure();
new ResizeObserver(() => measure()).observe(document.body);
</script>
