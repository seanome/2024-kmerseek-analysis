  </g>
  <g id="text_19">
   <text style="font-size: 7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(1.44 300.121164)">Hypothesis: If BLOSUM62 already credits a kept H/P class, the middle bar is well above zero.</text>
   <text style="font-size: 7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(1.44 307.709383)">Conclusion: identical residue: 16% of positions, +2.41 bits. same H/P class, different residue: 52% of positions,</text>
   <text style="font-size: 7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(1.44 315.21557)">+0.02 bits. different H/P class: 31% of positions, -0.86 bits.</text>
