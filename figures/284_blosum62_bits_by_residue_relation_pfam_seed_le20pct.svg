   <text style="font-size: 7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(1.44 6.540156)">TOOLS: no kmerseek; Pfam-A 38.2 seed pairs from notebook 230 at 20% identity or less; BLOSUM62 (Biopython),</text>
   <text style="font-size: 7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(1.44 14.050937)">hp_thomas_dill2 classes</text>
   <text style="font-size: 7px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif" transform="translate(1.44 21.562375)">Half of the aligned positions in distant Pfam pairs keep their H/P class with a different residue, and BLOSUM62</text>
